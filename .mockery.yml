all: false
dir: '{{.InterfaceDir}}'
filename: mocks_test.go
force-file-write: true
formatter: goimports
generate: true
include-auto-generated: false
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: '{{.SrcPackageName}}'
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  gitlab.education.tbank.ru/backend-academy-go-2025/homeworks/link-tracker:
    config:
      all: true
  gitlab.education.tbank.ru/backend-academy-go-2025/homeworks/link-tracker/internal/repository:
    config:
      dir: '{{.InterfaceDir}}/mock'
      filename: '{{.InterfaceName}}.go'
      pkgname: mock
    interfaces:
      SessionRepository:
  gitlab.education.tbank.ru/backend-academy-go-2025/homeworks/link-tracker/internal/application/tracker:
    config:
      dir: '{{.InterfaceDir}}/mock'
      filename: '{{.InterfaceName}}.go'
      pkgname: mock
    interfaces:
      Service:
  gitlab.education.tbank.ru/backend-academy-go-2025/homeworks/link-tracker/internal/infrastructure/external:
    config:
      dir: '{{.InterfaceDir}}/mock'
      filename: '{{.InterfaceName}}.go'
      pkgname: mock
    interfaces:
      LastUpdatedClient:
  gitlab.education.tbank.ru/backend-academy-go-2025/homeworks/link-tracker/internal/infrastructure/botclient:
    config:
      dir: '{{.InterfaceDir}}/mock'
      filename: '{{.InterfaceName}}.go'
      pkgname: mock
    interfaces:
      UpdatesSender:
